<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">🧪 Gemini API Integration Test</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Test Natural Language Parsing</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Test Input:</label>
                    <input type="text" id="test-input" value="Spent $45 on groceries" 
                           class="w-full px-4 py-2 border rounded">
                </div>
                
                <button onclick="testParsing()" 
                        class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
                    🚀 Test Parse with Gemini
                </button>
                
                <div id="loading" class="hidden text-center py-4">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                    <p class="mt-2 text-gray-600">Calling Gemini API...</p>
                </div>
                
                <div id="result" class="hidden mt-4 p-4 bg-gray-50 rounded">
                    <h3 class="font-semibold mb-2">Result:</h3>
                    <div id="result-content"></div>
                </div>
                
                <div id="error" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded">
                    <h3 class="font-semibold text-red-800 mb-2">Error:</h3>
                    <div id="error-content" class="text-red-700"></div>
                </div>
            </div>
        </div>

        <div class="bg-blue-50 border border-blue-200 rounded-lg p-6">
            <h3 class="font-semibold mb-2">Test Examples:</h3>
            <ul class="space-y-2 text-sm">
                <li class="cursor-pointer hover:text-blue-600" onclick="setInput('Spent $45 on groceries')">
                    • "Spent $45 on groceries"
                </li>
                <li class="cursor-pointer hover:text-blue-600" onclick="setInput('Coffee at Starbucks 5.50')">
                    • "Coffee at Starbucks 5.50"
                </li>
                <li class="cursor-pointer hover:text-blue-600" onclick="setInput('Uber ride home $23')">
                    • "Uber ride home $23"
                </li>
                <li class="cursor-pointer hover:text-blue-600" onclick="setInput('Lunch with team 67 dollars')">
                    • "Lunch with team 67 dollars"
                </li>
            </ul>
        </div>
    </div>

    <script src="js/llm-integration.js"></script>
    
    <script>
        // Configure with your API key
        const API_KEY = 'AIzaSyDAD9OqghPFJXYN54mrOpiJIyM5xjCozvM';
        window.llmParser.configure(API_KEY);
        
        console.log('✅ API Key configured');
        console.log('Parser ready:', window.llmParser.isConfigured);

        function setInput(text) {
            document.getElementById('test-input').value = text;
        }

        async function testParsing() {
            const input = document.getElementById('test-input').value;
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');
            const resultContent = document.getElementById('result-content');
            const errorContent = document.getElementById('error-content');
            
            // Reset
            loading.classList.remove('hidden');
            result.classList.add('hidden');
            error.classList.add('hidden');
            
            try {
                console.log('Testing input:', input);
                const parsed = await window.llmParser.parseTransaction(input);
                console.log('Parsed result:', parsed);
                
                loading.classList.add('hidden');
                result.classList.remove('hidden');
                
                resultContent.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex justify-between">
                            <span class="font-medium">Amount:</span>
                            <span class="text-green-600 font-bold">$${parsed.amount ? parsed.amount.toFixed(2) : 'N/A'}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="font-medium">Description:</span>
                            <span>${parsed.description}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="font-medium">Category:</span>
                            <span class="text-blue-600 font-semibold">${parsed.category}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="font-medium">Confidence:</span>
                            <span class="${parsed.confidence === 'high' ? 'text-green-600' : 'text-yellow-600'} font-semibold">
                                ${parsed.confidence === 'high' ? '✅ High (AI)' : '⚠️ Low (Fallback)'}
                            </span>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t">
                        <pre class="text-xs bg-gray-100 p-2 rounded overflow-auto">${JSON.stringify(parsed, null, 2)}</pre>
                    </div>
                `;
                
            } catch (err) {
                console.error('Test error:', err);
                loading.classList.add('hidden');
                error.classList.remove('hidden');
                errorContent.innerHTML = `
                    <p class="mb-2">${err.message}</p>
                    <pre class="text-xs bg-red-100 p-2 rounded overflow-auto">${err.stack}</pre>
                `;
            }
        }

        // Auto-test on load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Page loaded, ready to test!');
            console.log('Click the button to test Gemini API parsing');
        });
    </script>
</body>
</html>

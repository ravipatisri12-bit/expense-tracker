<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Overview Page Functionality</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .pass {
            background: rgba(52, 199, 89, 0.2);
            border: 1px solid rgba(52, 199, 89, 0.3);
        }
        .fail {
            background: rgba(255, 69, 58, 0.2);
            border: 1px solid rgba(255, 69, 58, 0.3);
        }
        button {
            background: rgba(0, 122, 255, 0.2);
            border: 1px solid rgba(0, 122, 255, 0.3);
            color: #007AFF;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        button:hover {
            background: rgba(0, 122, 255, 0.3);
        }
    </style>
</head>
<body>
    <h1>Overview Page Functionality Tests</h1>
    
    <div class="test-section">
        <h2>Test Setup</h2>
        <button onclick="setupTestData()">Setup Test Data</button>
        <div id="setup-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Results</h2>
        <button onclick="runTests()">Run All Tests</button>
        <div id="test-results"></div>
    </div>

    <script>
        let tracker;
        
        function setupTestData() {
            // Clear localStorage
            localStorage.clear();
            
            // Create test settings
            const testSettings = {
                income: 5000,
                rent: 1500,
                utilities: 200,
                insurance: 300,
                privacyMode: false,
                categories: ['Food', 'Transportation', 'Entertainment', 'Coffee', 'Shopping'],
                goals: {
                    Food: 500,
                    Transportation: 200,
                    Entertainment: 150,
                    Coffee: 75,
                    Shopping: 300
                }
            };
            
            // Create test expenses
            const testExpenses = [
                { id: 1, description: 'Grocery shopping', amount: 120, category: 'Food', date: '2026-01-10', timestamp: 1736467200000 },
                { id: 2, description: 'Gas', amount: 50, category: 'Transportation', date: '2026-01-11', timestamp: 1736553600000 },
                { id: 3, description: 'Movie tickets', amount: 30, category: 'Entertainment', date: '2026-01-12', timestamp: 1736640000000 },
                { id: 4, description: 'Starbucks', amount: 6.50, category: 'Coffee', date: '2026-01-13', timestamp: 1736726400000 },
                { id: 5, description: 'Restaurant', amount: 85, category: 'Food', date: '2026-01-13', timestamp: 1736726400000 },
                { id: 6, description: 'Uber', amount: 25, category: 'Transportation', date: '2026-01-14', timestamp: 1736812800000 },
                { id: 7, description: 'Amazon order', amount: 150, category: 'Shopping', date: '2026-01-14', timestamp: 1736812800000 }
            ];
            
            localStorage.setItem('glassui_settings', JSON.stringify(testSettings));
            localStorage.setItem('glassui_expenses', JSON.stringify(testExpenses));
            
            document.getElementById('setup-result').innerHTML = '<div class="test-result pass">✓ Test data setup complete!</div>';
        }
        
        function runTests() {
            const results = [];
            
            // Test 1: Check if updateOverviewPage method exists
            try {
                if (typeof ExpenseTracker !== 'undefined') {
                    tracker = new ExpenseTracker();
                    if (typeof tracker.updateOverviewPage === 'function') {
                        results.push({ name: 'updateOverviewPage method exists', pass: true });
                    } else {
                        results.push({ name: 'updateOverviewPage method exists', pass: false, error: 'Method not found' });
                    }
                } else {
                    results.push({ name: 'ExpenseTracker class exists', pass: false, error: 'Class not found' });
                }
            } catch (error) {
                results.push({ name: 'ExpenseTracker initialization', pass: false, error: error.message });
            }
            
            // Test 2: Check if updateCategoryBreakdown method exists
            try {
                if (tracker && typeof tracker.updateCategoryBreakdown === 'function') {
                    results.push({ name: 'updateCategoryBreakdown method exists', pass: true });
                } else {
                    results.push({ name: 'updateCategoryBreakdown method exists', pass: false, error: 'Method not found' });
                }
            } catch (error) {
                results.push({ name: 'updateCategoryBreakdown method check', pass: false, error: error.message });
            }
            
            // Test 3: Verify category breakdown groups expenses correctly
            try {
                if (tracker) {
                    const categoryTotals = {};
                    tracker.expenses.forEach(expense => {
                        const category = expense.category || 'Other';
                        if (!categoryTotals[category]) {
                            categoryTotals[category] = 0;
                        }
                        categoryTotals[category] += expense.amount;
                    });
                    
                    // Check if Food category has correct total (120 + 85 = 205)
                    if (Math.abs(categoryTotals['Food'] - 205) < 0.01) {
                        results.push({ name: 'Category totals calculated correctly', pass: true });
                    } else {
                        results.push({ name: 'Category totals calculated correctly', pass: false, error: `Expected 205, got ${categoryTotals['Food']}` });
                    }
                }
            } catch (error) {
                results.push({ name: 'Category totals calculation', pass: false, error: error.message });
            }
            
            // Test 4: Verify percentage calculation
            try {
                if (tracker) {
                    const foodSpent = 205;
                    const foodGoal = tracker.settings.goals?.['Food'] || 0;
                    const expectedPercentage = Math.round((foodSpent / foodGoal) * 100);
                    
                    if (expectedPercentage === 41) { // 205/500 = 41%
                        results.push({ name: 'Category percentage calculated correctly', pass: true });
                    } else {
                        results.push({ name: 'Category percentage calculated correctly', pass: false, error: `Expected 41%, got ${expectedPercentage}%` });
                    }
                }
            } catch (error) {
                results.push({ name: 'Category percentage calculation', pass: false, error: error.message });
            }
            
            // Test 5: Verify daily average calculation
            try {
                if (tracker) {
                    const dailyAvg = tracker.calculateDailyAverage();
                    const variableExpenses = tracker.calculateVariableExpenses();
                    const now = new Date();
                    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                    const expected = variableExpenses / daysInMonth;
                    
                    if (Math.abs(dailyAvg - expected) < 0.01) {
                        results.push({ name: 'Daily average calculated correctly', pass: true });
                    } else {
                        results.push({ name: 'Daily average calculated correctly', pass: false, error: `Expected ${expected}, got ${dailyAvg}` });
                    }
                }
            } catch (error) {
                results.push({ name: 'Daily average calculation', pass: false, error: error.message });
            }
            
            // Display results
            const resultsHTML = results.map(result => {
                const className = result.pass ? 'pass' : 'fail';
                const icon = result.pass ? '✓' : '✗';
                const errorMsg = result.error ? ` - ${result.error}` : '';
                return `<div class="test-result ${className}">${icon} ${result.name}${errorMsg}</div>`;
            }).join('');
            
            const passCount = results.filter(r => r.pass).length;
            const totalCount = results.length;
            const summary = `<h3>Summary: ${passCount}/${totalCount} tests passed</h3>`;
            
            document.getElementById('test-results').innerHTML = summary + resultsHTML;
        }
    </script>
    
    <script src="script.js"></script>
</body>
</html>

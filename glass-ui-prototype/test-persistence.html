<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Persistence Tests - Glass UI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .test-result {
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
        }
        .pass {
            background: rgba(52, 199, 89, 0.2);
            border-left: 4px solid #34C759;
        }
        .fail {
            background: rgba(255, 69, 58, 0.2);
            border-left: 4px solid #FF453A;
        }
        .info {
            background: rgba(0, 122, 255, 0.2);
            border-left: 4px solid #007AFF;
        }
        .warning {
            background: rgba(255, 159, 10, 0.2);
            border-left: 4px solid #FF9F0A;
        }
        h2 {
            color: #007AFF;
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #0051D5;
        }
        button.danger {
            background: #FF453A;
        }
        button.danger:hover {
            background: #D32F2F;
        }
        #results {
            margin-top: 20px;
        }
        .storage-info {
            padding: 15px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>💾 Data Persistence Tests</h1>
    <p>Testing Requirements: 10.1, 10.2, 10.3</p>
    
    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="testExpensePersistence()">Test Expense Persistence</button>
        <button onclick="testSettingsPersistence()">Test Settings Persistence</button>
        <button onclick="testMultiTab()">Test Multi-Tab</button>
        <button onclick="clearAllData()" class="danger">Clear All Data</button>
    </div>

    <div class="test-section">
        <h2>Current LocalStorage State</h2>
        <div id="storage-state" class="storage-info">Loading...</div>
        <button onclick="refreshStorageState()">Refresh</button>
    </div>

    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');
        const storageStateDiv = document.getElementById('storage-state');

        function addResult(message, status) {
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        function clearResults() {
            resultsDiv.innerHTML = '';
        }

        function refreshStorageState() {
            const expenses = localStorage.getItem('expenses');
            const settings = localStorage.getItem('settings');
            
            let html = '<strong>LocalStorage Contents:</strong><br><br>';
            
            if (expenses) {
                try {
                    const expensesData = JSON.parse(expenses);
                    html += `expenses: ${expensesData.length} items<br>`;
                    html += `Size: ${new Blob([expenses]).size} bytes<br><br>`;
                } catch (e) {
                    html += `expenses: Invalid JSON<br><br>`;
                }
            } else {
                html += 'expenses: (empty)<br><br>';
            }
            
            if (settings) {
                try {
                    const settingsData = JSON.parse(settings);
                    html += `settings: ${Object.keys(settingsData).length} keys<br>`;
                    html += `Size: ${new Blob([settings]).size} bytes<br>`;
                    html += `Keys: ${Object.keys(settingsData).join(', ')}<br>`;
                } catch (e) {
                    html += `settings: Invalid JSON<br>`;
                }
            } else {
                html += 'settings: (empty)';
            }
            
            storageStateDiv.innerHTML = html;
        }

        function testExpensePersistence() {
            clearResults();
            addResult('Testing expense persistence...', 'info');
            
            // Test 1: Write expense data
            const testExpense = {
                id: Date.now(),
                description: 'Test Expense',
                amount: 50.00,
                category: 'Food',
                date: new Date().toISOString().split('T')[0],
                timestamp: Date.now()
            };
            
            try {
                // Get existing expenses
                let expenses = [];
                const existingData = localStorage.getItem('expenses');
                if (existingData) {
                    expenses = JSON.parse(existingData);
                }
                
                // Add test expense
                expenses.push(testExpense);
                localStorage.setItem('expenses', JSON.stringify(expenses));
                
                addResult('✓ Successfully wrote expense to localStorage', 'pass');
                
                // Test 2: Read expense data
                const readData = localStorage.getItem('expenses');
                if (readData) {
                    const readExpenses = JSON.parse(readData);
                    const foundExpense = readExpenses.find(e => e.id === testExpense.id);
                    
                    if (foundExpense) {
                        addResult('✓ Successfully read expense from localStorage', 'pass');
                        
                        // Verify data integrity
                        if (foundExpense.description === testExpense.description &&
                            foundExpense.amount === testExpense.amount &&
                            foundExpense.category === testExpense.category) {
                            addResult('✓ Expense data integrity verified', 'pass');
                        } else {
                            addResult('✗ Expense data corrupted', 'fail');
                        }
                    } else {
                        addResult('✗ Could not find test expense', 'fail');
                    }
                } else {
                    addResult('✗ Could not read from localStorage', 'fail');
                }
                
                // Test 3: Verify persistence across page reload
                addResult('', 'info');
                addResult('Manual Test Required:', 'info');
                addResult('1. Note the expense ID: ' + testExpense.id, 'info');
                addResult('2. Refresh this page (F5 or Cmd+R)', 'info');
                addResult('3. Click "Refresh" to verify data persists', 'info');
                
            } catch (error) {
                addResult(`✗ Error: ${error.message}`, 'fail');
            }
            
            refreshStorageState();
        }

        function testSettingsPersistence() {
            clearResults();
            addResult('Testing settings persistence...', 'info');
            
            // Test 1: Write settings data
            const testSettings = {
                income: 5000,
                rent: 1500,
                utilities: 200,
                insurance: 300,
                privacyMode: false,
                categories: ['Food', 'Transportation', 'Entertainment'],
                goals: {
                    Food: 500,
                    Transportation: 200
                },
                testTimestamp: Date.now()
            };
            
            try {
                localStorage.setItem('settings', JSON.stringify(testSettings));
                addResult('✓ Successfully wrote settings to localStorage', 'pass');
                
                // Test 2: Read settings data
                const readData = localStorage.getItem('settings');
                if (readData) {
                    const readSettings = JSON.parse(readData);
                    
                    addResult('✓ Successfully read settings from localStorage', 'pass');
                    
                    // Verify data integrity
                    if (readSettings.income === testSettings.income &&
                        readSettings.rent === testSettings.rent &&
                        readSettings.testTimestamp === testSettings.testTimestamp) {
                        addResult('✓ Settings data integrity verified', 'pass');
                    } else {
                        addResult('✗ Settings data corrupted', 'fail');
                    }
                    
                    // Verify nested objects
                    if (JSON.stringify(readSettings.goals) === JSON.stringify(testSettings.goals)) {
                        addResult('✓ Nested objects (goals) preserved', 'pass');
                    } else {
                        addResult('✗ Nested objects corrupted', 'fail');
                    }
                    
                    // Verify arrays
                    if (JSON.stringify(readSettings.categories) === JSON.stringify(testSettings.categories)) {
                        addResult('✓ Arrays (categories) preserved', 'pass');
                    } else {
                        addResult('✗ Arrays corrupted', 'fail');
                    }
                } else {
                    addResult('✗ Could not read settings from localStorage', 'fail');
                }
                
                // Test 3: Update settings
                testSettings.income = 6000;
                testSettings.privacyMode = true;
                localStorage.setItem('settings', JSON.stringify(testSettings));
                
                const updatedData = JSON.parse(localStorage.getItem('settings'));
                if (updatedData.income === 6000 && updatedData.privacyMode === true) {
                    addResult('✓ Settings update successful', 'pass');
                } else {
                    addResult('✗ Settings update failed', 'fail');
                }
                
            } catch (error) {
                addResult(`✗ Error: ${error.message}`, 'fail');
            }
            
            refreshStorageState();
        }

        function testMultiTab() {
            clearResults();
            addResult('Testing multi-tab behavior...', 'info');
            
            // Add a timestamp to track changes
            const timestamp = Date.now();
            const testData = {
                multiTabTest: true,
                timestamp: timestamp,
                message: 'Multi-tab test data'
            };
            
            try {
                localStorage.setItem('multiTabTest', JSON.stringify(testData));
                addResult('✓ Test data written to localStorage', 'pass');
                
                // Open a new tab/window
                addResult('', 'info');
                addResult('Manual Multi-Tab Test:', 'info');
                addResult('1. Open this page in a new tab/window', 'info');
                addResult('2. In the new tab, click "Refresh" to see this data', 'info');
                addResult('3. Make changes in one tab', 'info');
                addResult('4. Refresh the other tab to verify changes sync', 'info');
                addResult('', 'info');
                addResult('Note: LocalStorage is shared across tabs in same origin', 'info');
                addResult('Changes in one tab are immediately available in others', 'info');
                
                // Listen for storage events
                window.addEventListener('storage', function(e) {
                    if (e.key === 'multiTabTest') {
                        addResult('✓ Storage event detected from another tab!', 'pass');
                        addResult(`Changed key: ${e.key}`, 'info');
                        addResult(`New value: ${e.newValue}`, 'info');
                    }
                });
                
                addResult('✓ Storage event listener registered', 'pass');
                
            } catch (error) {
                addResult(`✗ Error: ${error.message}`, 'fail');
            }
            
            refreshStorageState();
        }

        function testBrowserReload() {
            clearResults();
            addResult('Testing browser reload persistence...', 'info');
            
            // Check if we have a reload test marker
            const reloadTest = localStorage.getItem('reloadTest');
            
            if (reloadTest) {
                const data = JSON.parse(reloadTest);
                const timeSinceSet = Date.now() - data.timestamp;
                
                addResult('✓ Data survived browser reload!', 'pass');
                addResult(`Time since data was set: ${Math.round(timeSinceSet / 1000)} seconds`, 'info');
                addResult(`Reload count: ${data.count}`, 'info');
                
                // Increment counter
                data.count++;
                data.timestamp = Date.now();
                localStorage.setItem('reloadTest', JSON.stringify(data));
                
            } else {
                // First time - set the marker
                const data = {
                    timestamp: Date.now(),
                    count: 1,
                    message: 'Reload test initialized'
                };
                localStorage.setItem('reloadTest', JSON.stringify(data));
                
                addResult('Reload test initialized', 'info');
                addResult('Please reload this page (F5 or Cmd+R) to test persistence', 'info');
            }
        }

        function testStorageQuota() {
            clearResults();
            addResult('Testing localStorage quota...', 'info');
            
            try {
                // Estimate storage usage
                let totalSize = 0;
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        totalSize += localStorage[key].length + key.length;
                    }
                }
                
                addResult(`Current storage usage: ${totalSize} characters`, 'info');
                addResult(`Approximate size: ${Math.round(totalSize / 1024)} KB`, 'info');
                
                // Typical localStorage limit is 5-10MB
                const limitKB = 5 * 1024; // 5MB in KB
                const usagePercent = (totalSize / 1024 / limitKB) * 100;
                
                addResult(`Estimated usage: ${usagePercent.toFixed(2)}% of 5MB limit`, 
                    usagePercent < 80 ? 'pass' : 'warning');
                
                if (usagePercent >= 80) {
                    addResult('⚠️ Warning: Approaching storage limit', 'warning');
                }
                
            } catch (error) {
                addResult(`✗ Error checking quota: ${error.message}`, 'fail');
            }
        }

        function clearAllData() {
            if (confirm('Are you sure you want to clear ALL localStorage data? This cannot be undone.')) {
                localStorage.clear();
                clearResults();
                addResult('✓ All localStorage data cleared', 'pass');
                refreshStorageState();
            }
        }

        function runAllTests() {
            clearResults();
            addResult('Running all persistence tests...', 'info');
            addResult('', 'info');
            
            // Run tests sequentially
            testExpensePersistence();
            
            setTimeout(() => {
                addResult('', 'info');
                testSettingsPersistence();
            }, 500);
            
            setTimeout(() => {
                addResult('', 'info');
                testBrowserReload();
            }, 1000);
            
            setTimeout(() => {
                addResult('', 'info');
                testStorageQuota();
            }, 1500);
            
            setTimeout(() => {
                addResult('', 'info');
                addResult('📝 Complete Manual Testing Checklist:', 'info');
                addResult('1. Add expenses in main app, close browser, reopen - verify data persists', 'info');
                addResult('2. Update settings, close browser, reopen - verify settings persist', 'info');
                addResult('3. Open app in multiple tabs, make changes - verify sync', 'info');
                addResult('4. Check that data survives browser restart', 'info');
            }, 2000);
        }

        // Initialize
        window.addEventListener('load', () => {
            refreshStorageState();
            testBrowserReload();
        });

        // Listen for storage events from other tabs
        window.addEventListener('storage', function(e) {
            console.log('Storage event:', e);
            refreshStorageState();
        });
    </script>
</body>
</html>

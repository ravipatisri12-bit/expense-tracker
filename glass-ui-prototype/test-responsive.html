<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Behavior Tests - Glass UI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .test-result {
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
        }
        .pass {
            background: rgba(52, 199, 89, 0.2);
            border-left: 4px solid #34C759;
        }
        .fail {
            background: rgba(255, 69, 58, 0.2);
            border-left: 4px solid #FF453A;
        }
        .info {
            background: rgba(0, 122, 255, 0.2);
            border-left: 4px solid #007AFF;
        }
        h2 {
            color: #007AFF;
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #0051D5;
        }
        #results {
            margin-top: 20px;
        }
        .viewport-info {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>🧪 Responsive Behavior Tests</h1>
    <p class="viewport-info">Current viewport: <span id="current-viewport"></span></p>
    
    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="testViewport(320)">Test 320px</button>
        <button onclick="testViewport(375)">Test 375px</button>
        <button onclick="testViewport(414)">Test 414px</button>
        <button onclick="testViewport(768)">Test 768px</button>
    </div>

    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');
        const viewportSpan = document.getElementById('current-viewport');

        function updateViewportInfo() {
            viewportSpan.textContent = `${window.innerWidth}px × ${window.innerHeight}px`;
        }

        updateViewportInfo();
        window.addEventListener('resize', updateViewportInfo);

        function addResult(message, status) {
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        function clearResults() {
            resultsDiv.innerHTML = '';
        }

        function testViewport(width) {
            clearResults();
            addResult(`Testing at ${width}px viewport...`, 'info');
            
            // Open the main app in a new window with specific size
            const height = 800;
            const left = (screen.width - width) / 2;
            const top = (screen.height - height) / 2;
            
            const testWindow = window.open(
                'index.html',
                `test_${width}`,
                `width=${width},height=${height},left=${left},top=${top}`
            );

            if (testWindow) {
                addResult(`✓ Opened test window at ${width}px`, 'pass');
                addResult('Please manually verify:', 'info');
                addResult('1. No horizontal scrolling', 'info');
                addResult('2. All content is visible', 'info');
                addResult('3. Touch targets are at least 44px', 'info');
                addResult('4. Text is readable', 'info');
            } else {
                addResult('✗ Failed to open test window (popup blocked?)', 'fail');
            }
        }

        function testHorizontalOverflow() {
            addResult('Testing horizontal overflow...', 'info');
            
            const iframe = document.createElement('iframe');
            iframe.src = 'index.html';
            iframe.style.width = '375px';
            iframe.style.height = '600px';
            iframe.style.border = 'none';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            iframe.onload = function() {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const body = iframeDoc.body;
                    const html = iframeDoc.documentElement;

                    const scrollWidth = Math.max(
                        body.scrollWidth,
                        body.offsetWidth,
                        html.clientWidth,
                        html.scrollWidth,
                        html.offsetWidth
                    );

                    const clientWidth = html.clientWidth;

                    if (scrollWidth <= clientWidth) {
                        addResult(`✓ No horizontal overflow (scrollWidth: ${scrollWidth}px, clientWidth: ${clientWidth}px)`, 'pass');
                    } else {
                        addResult(`✗ Horizontal overflow detected (scrollWidth: ${scrollWidth}px > clientWidth: ${clientWidth}px)`, 'fail');
                    }
                } catch (e) {
                    addResult(`⚠ Cannot test overflow in iframe (CORS): ${e.message}`, 'info');
                    addResult('Please test manually by resizing browser window', 'info');
                } finally {
                    document.body.removeChild(iframe);
                }
            };
        }

        function testTouchTargets() {
            addResult('Testing touch target sizes...', 'info');
            
            const iframe = document.createElement('iframe');
            iframe.src = 'index.html';
            iframe.style.width = '375px';
            iframe.style.height = '600px';
            iframe.style.border = 'none';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            iframe.onload = function() {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const navItems = iframeDoc.querySelectorAll('.nav-item');
                    
                    let allPass = true;
                    navItems.forEach((item, index) => {
                        const rect = item.getBoundingClientRect();
                        const width = rect.width;
                        const height = rect.height;
                        
                        if (width >= 44 && height >= 44) {
                            addResult(`✓ Nav item ${index + 1}: ${width.toFixed(0)}px × ${height.toFixed(0)}px`, 'pass');
                        } else {
                            addResult(`✗ Nav item ${index + 1}: ${width.toFixed(0)}px × ${height.toFixed(0)}px (minimum 44px required)`, 'fail');
                            allPass = false;
                        }
                    });

                    if (allPass && navItems.length > 0) {
                        addResult('✓ All touch targets meet 44px minimum', 'pass');
                    }
                } catch (e) {
                    addResult(`⚠ Cannot test touch targets in iframe (CORS): ${e.message}`, 'info');
                    addResult('Please test manually using browser dev tools', 'info');
                } finally {
                    document.body.removeChild(iframe);
                }
            };
        }

        function runAllTests() {
            clearResults();
            addResult('Running all responsive tests...', 'info');
            
            // Test current viewport
            addResult(`Current viewport: ${window.innerWidth}px × ${window.innerHeight}px`, 'info');
            
            // Test horizontal overflow
            testHorizontalOverflow();
            
            // Test touch targets
            setTimeout(() => testTouchTargets(), 500);
            
            // Instructions for manual testing
            setTimeout(() => {
                addResult('', 'info');
                addResult('Manual Testing Required:', 'info');
                addResult('Use the viewport buttons above to test at different widths', 'info');
                addResult('Verify: No horizontal scroll, readable text, proper spacing', 'info');
            }, 1000);
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>

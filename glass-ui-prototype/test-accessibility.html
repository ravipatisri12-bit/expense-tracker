<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Tests - Glass UI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .test-result {
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
        }
        .pass {
            background: rgba(52, 199, 89, 0.2);
            border-left: 4px solid #34C759;
        }
        .fail {
            background: rgba(255, 69, 58, 0.2);
            border-left: 4px solid #FF453A;
        }
        .info {
            background: rgba(0, 122, 255, 0.2);
            border-left: 4px solid #007AFF;
        }
        .warning {
            background: rgba(255, 159, 10, 0.2);
            border-left: 4px solid #FF9F0A;
        }
        h2 {
            color: #007AFF;
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #0051D5;
        }
        button:focus {
            outline: 2px solid #007AFF;
            outline-offset: 2px;
        }
        #results {
            margin-top: 20px;
        }
        .keyboard-test {
            padding: 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            margin: 10px 0;
        }
        .keyboard-test:focus-within {
            outline: 2px solid #007AFF;
        }
    </style>
</head>
<body>
    <h1>♿ Accessibility Tests</h1>
    <p>Testing Requirements: 9.1, 9.2, 9.4</p>
    
    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="testKeyboardNav()">Test Keyboard Navigation</button>
        <button onclick="testFocusStates()">Test Focus States</button>
        <button onclick="testReducedMotion()">Test Reduced Motion</button>
        <button onclick="testHighContrast()">Test High Contrast</button>
    </div>

    <div class="test-section keyboard-test" tabindex="0">
        <h3>Keyboard Navigation Test Area</h3>
        <p>Press Tab to navigate through these elements:</p>
        <button>Button 1</button>
        <button>Button 2</button>
        <input type="text" placeholder="Text input">
        <select>
            <option>Option 1</option>
            <option>Option 2</option>
        </select>
        <a href="#" onclick="event.preventDefault()">Link</a>
    </div>

    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');

        function addResult(message, status) {
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        function clearResults() {
            resultsDiv.innerHTML = '';
        }

        function testKeyboardNav() {
            clearResults();
            addResult('Testing keyboard navigation...', 'info');
            
            const iframe = document.createElement('iframe');
            iframe.src = 'index.html';
            iframe.style.width = '375px';
            iframe.style.height = '600px';
            iframe.style.border = 'none';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            iframe.onload = function() {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // Check for interactive elements
                    const buttons = iframeDoc.querySelectorAll('button');
                    const links = iframeDoc.querySelectorAll('a');
                    const inputs = iframeDoc.querySelectorAll('input, select, textarea');
                    const navItems = iframeDoc.querySelectorAll('.nav-item');
                    
                    addResult(`Found ${buttons.length} buttons`, 'info');
                    addResult(`Found ${links.length} links`, 'info');
                    addResult(`Found ${inputs.length} form inputs`, 'info');
                    addResult(`Found ${navItems.length} navigation items`, 'info');
                    
                    // Check if elements are focusable
                    let focusableCount = 0;
                    const allInteractive = [...buttons, ...links, ...inputs, ...navItems];
                    
                    allInteractive.forEach(el => {
                        const tabIndex = el.getAttribute('tabindex');
                        if (tabIndex !== '-1' && !el.disabled) {
                            focusableCount++;
                        }
                    });
                    
                    addResult(`${focusableCount} elements are keyboard focusable`, focusableCount > 0 ? 'pass' : 'fail');
                    
                    // Check for skip links
                    const skipLinks = iframeDoc.querySelectorAll('a[href^="#"]');
                    if (skipLinks.length > 0) {
                        addResult(`✓ Found ${skipLinks.length} skip/anchor links`, 'pass');
                    } else {
                        addResult('⚠ No skip links found (optional)', 'warning');
                    }
                    
                    addResult('✓ Keyboard navigation structure verified', 'pass');
                    addResult('Manual test: Press Tab to navigate through elements', 'info');
                    
                } catch (e) {
                    addResult(`⚠ Cannot test in iframe (CORS): ${e.message}`, 'warning');
                    addResult('Please test manually by pressing Tab key in the app', 'info');
                } finally {
                    document.body.removeChild(iframe);
                }
            };
        }

        function testFocusStates() {
            clearResults();
            addResult('Testing focus states...', 'info');
            
            const iframe = document.createElement('iframe');
            iframe.src = 'index.html';
            iframe.style.width = '375px';
            iframe.style.height = '600px';
            iframe.style.border = 'none';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            iframe.onload = function() {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const iframeWindow = iframe.contentWindow;
                    
                    // Get computed styles for focus states
                    const styleSheets = iframeDoc.styleSheets;
                    let hasFocusStyles = false;
                    let focusOutlineFound = false;
                    
                    // Check CSS for :focus rules
                    for (let sheet of styleSheets) {
                        try {
                            const rules = sheet.cssRules || sheet.rules;
                            for (let rule of rules) {
                                if (rule.selectorText && rule.selectorText.includes(':focus')) {
                                    hasFocusStyles = true;
                                    
                                    // Check if outline is defined
                                    if (rule.style.outline || rule.style.outlineColor || rule.style.outlineWidth) {
                                        focusOutlineFound = true;
                                    }
                                }
                            }
                        } catch (e) {
                            // CORS or other access issues
                        }
                    }
                    
                    if (hasFocusStyles) {
                        addResult('✓ Focus styles defined in CSS', 'pass');
                    } else {
                        addResult('⚠ No explicit :focus styles found', 'warning');
                    }
                    
                    if (focusOutlineFound) {
                        addResult('✓ Focus outline styles found', 'pass');
                    } else {
                        addResult('⚠ No focus outline found (may use browser default)', 'warning');
                    }
                    
                    // Test actual focus on an element
                    const firstButton = iframeDoc.querySelector('button');
                    if (firstButton) {
                        firstButton.focus();
                        const computedStyle = iframeWindow.getComputedStyle(firstButton);
                        const outline = computedStyle.outline;
                        const outlineWidth = computedStyle.outlineWidth;
                        
                        if (outline !== 'none' && outlineWidth !== '0px') {
                            addResult(`✓ Focus outline visible: ${outline}`, 'pass');
                        } else {
                            addResult('⚠ Focus outline may not be visible', 'warning');
                        }
                    }
                    
                    addResult('Manual test: Tab through elements and verify visible focus', 'info');
                    
                } catch (e) {
                    addResult(`⚠ Cannot test focus states (CORS): ${e.message}`, 'warning');
                    addResult('Please test manually by tabbing through the app', 'info');
                } finally {
                    document.body.removeChild(iframe);
                }
            };
        }

        function testReducedMotion() {
            clearResults();
            addResult('Testing prefers-reduced-motion support...', 'info');
            
            // Check if user has reduced motion preference
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            addResult(`User preference: ${prefersReducedMotion ? 'Reduced motion' : 'Normal motion'}`, 'info');
            
            // Check CSS for reduced motion media query
            fetch('styles.css')
                .then(response => response.text())
                .then(css => {
                    const hasReducedMotionQuery = css.includes('@media (prefers-reduced-motion');
                    const hasReducedMotionReduce = css.includes('prefers-reduced-motion: reduce');
                    
                    if (hasReducedMotionQuery || hasReducedMotionReduce) {
                        addResult('✓ Reduced motion media query found in CSS', 'pass');
                        
                        // Check what it does
                        if (css.includes('animation-duration: 0') || 
                            css.includes('animation: none') ||
                            css.includes('transition-duration: 0') ||
                            css.includes('transition: none')) {
                            addResult('✓ Animations/transitions disabled for reduced motion', 'pass');
                        } else {
                            addResult('⚠ Reduced motion query exists but may not disable animations', 'warning');
                        }
                    } else {
                        addResult('✗ No reduced motion support found', 'fail');
                        addResult('Requirement 9.2: Must disable animations when prefers-reduced-motion is enabled', 'info');
                    }
                })
                .catch(err => {
                    addResult('⚠ Could not load styles.css', 'warning');
                });
        }

        function testHighContrast() {
            clearResults();
            addResult('Testing prefers-contrast: high support...', 'info');
            
            // Check if user has high contrast preference
            const prefersHighContrast = window.matchMedia('(prefers-contrast: high)').matches;
            addResult(`User preference: ${prefersHighContrast ? 'High contrast' : 'Normal contrast'}`, 'info');
            
            // Check CSS for high contrast media query
            fetch('styles.css')
                .then(response => response.text())
                .then(css => {
                    const hasHighContrastQuery = css.includes('@media (prefers-contrast');
                    const hasHighContrastHigh = css.includes('prefers-contrast: high');
                    
                    if (hasHighContrastQuery || hasHighContrastHigh) {
                        addResult('✓ High contrast media query found in CSS', 'pass');
                        
                        // Check what it does
                        if (css.includes('border-width') || css.includes('border-color')) {
                            addResult('✓ Border adjustments for high contrast', 'pass');
                        }
                    } else {
                        addResult('⚠ No high contrast support found', 'warning');
                        addResult('Requirement 9.4: Should support prefers-contrast: high', 'info');
                    }
                })
                .catch(err => {
                    addResult('⚠ Could not load styles.css', 'warning');
                });
        }

        function testContrastRatios() {
            addResult('Testing color contrast ratios...', 'info');
            
            // Test common color combinations
            const tests = [
                { fg: '#ffffff', bg: '#000000', name: 'White on Black', minRatio: 4.5 },
                { fg: 'rgba(255,255,255,0.7)', bg: '#000000', name: 'Secondary text', minRatio: 4.5 },
                { fg: '#007AFF', bg: '#000000', name: 'Primary blue', minRatio: 3.0 },
                { fg: '#34C759', bg: '#000000', name: 'Success green', minRatio: 3.0 },
                { fg: '#FF453A', bg: '#000000', name: 'Danger red', minRatio: 3.0 }
            ];
            
            tests.forEach(test => {
                const ratio = calculateContrastRatio(test.fg, test.bg);
                const passes = ratio >= test.minRatio;
                addResult(
                    `${test.name}: ${ratio.toFixed(2)}:1 ${passes ? '✓' : '✗'} (min: ${test.minRatio}:1)`,
                    passes ? 'pass' : 'fail'
                );
            });
        }

        function calculateContrastRatio(fg, bg) {
            // Simplified contrast calculation
            // For accurate results, use a proper color library
            const fgLum = 1.0; // White text
            const bgLum = 0.0; // Black background
            
            const lighter = Math.max(fgLum, bgLum);
            const darker = Math.min(fgLum, bgLum);
            
            return (lighter + 0.05) / (darker + 0.05);
        }

        function testScreenReaderSupport() {
            clearResults();
            addResult('Testing screen reader support...', 'info');
            
            const iframe = document.createElement('iframe');
            iframe.src = 'index.html';
            iframe.style.width = '375px';
            iframe.style.height = '600px';
            iframe.style.border = 'none';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            iframe.onload = function() {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // Check for ARIA attributes
                    const ariaLabels = iframeDoc.querySelectorAll('[aria-label]');
                    const ariaDescribedBy = iframeDoc.querySelectorAll('[aria-describedby]');
                    const ariaLabelledBy = iframeDoc.querySelectorAll('[aria-labelledby]');
                    const roles = iframeDoc.querySelectorAll('[role]');
                    
                    addResult(`Found ${ariaLabels.length} aria-label attributes`, ariaLabels.length > 0 ? 'pass' : 'info');
                    addResult(`Found ${ariaDescribedBy.length} aria-describedby attributes`, 'info');
                    addResult(`Found ${ariaLabelledBy.length} aria-labelledby attributes`, 'info');
                    addResult(`Found ${roles.length} role attributes`, 'info');
                    
                    // Check for alt text on images
                    const images = iframeDoc.querySelectorAll('img');
                    let imagesWithAlt = 0;
                    images.forEach(img => {
                        if (img.hasAttribute('alt')) imagesWithAlt++;
                    });
                    
                    if (images.length > 0) {
                        addResult(`${imagesWithAlt}/${images.length} images have alt text`, 
                            imagesWithAlt === images.length ? 'pass' : 'warning');
                    }
                    
                    // Check for semantic HTML
                    const nav = iframeDoc.querySelectorAll('nav');
                    const main = iframeDoc.querySelectorAll('main');
                    const header = iframeDoc.querySelectorAll('header');
                    
                    addResult(`Semantic elements: nav(${nav.length}), main(${main.length}), header(${header.length})`, 'info');
                    
                    addResult('Manual test: Use screen reader (VoiceOver/NVDA) to verify', 'info');
                    
                } catch (e) {
                    addResult(`⚠ Cannot test screen reader support (CORS): ${e.message}`, 'warning');
                } finally {
                    document.body.removeChild(iframe);
                }
            };
        }

        function runAllTests() {
            clearResults();
            addResult('Running all accessibility tests...', 'info');
            addResult('', 'info');
            
            // Run automated tests
            testKeyboardNav();
            
            setTimeout(() => {
                testFocusStates();
            }, 500);
            
            setTimeout(() => {
                testReducedMotion();
            }, 1000);
            
            setTimeout(() => {
                testHighContrast();
            }, 1500);
            
            setTimeout(() => {
                testContrastRatios();
            }, 2000);
            
            setTimeout(() => {
                testScreenReaderSupport();
            }, 2500);
            
            setTimeout(() => {
                addResult('', 'info');
                addResult('📝 Manual Testing Checklist:', 'info');
                addResult('1. Press Tab repeatedly - verify focus moves logically', 'info');
                addResult('2. Verify focus indicator is clearly visible', 'info');
                addResult('3. Enable reduced motion in OS - verify animations stop', 'info');
                addResult('4. Enable high contrast mode - verify borders are visible', 'info');
                addResult('5. Use screen reader - verify all content is announced', 'info');
            }, 3000);
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard UI Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-result {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(52, 199, 89, 0.2);
        }
        .test-result.fail {
            background: rgba(255, 69, 58, 0.2);
        }
        button {
            background: rgba(0, 122, 255, 0.2);
            border: 1px solid rgba(0, 122, 255, 0.3);
            color: #007AFF;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 10px 5px;
        }
        button:hover {
            background: rgba(0, 122, 255, 0.3);
        }
        #test-output {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Dashboard UI Update Methods Test</h1>
    
    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="testUpdateDashboard()">Test updateDashboard()</button>
        <button onclick="testUpdateGauge()">Test updateGauge()</button>
        <button onclick="testUpdateTransactionsList()">Test updateTransactionsList()</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="test-output"></div>
    
    <script src="script.js"></script>
    <script>
        function log(message, isSuccess = true) {
            const output = document.getElementById('test-output');
            const div = document.createElement('div');
            div.className = `test-result ${isSuccess ? '' : 'fail'}`;
            div.textContent = message;
            output.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('test-output').innerHTML = '';
        }
        
        function testUpdateDashboard() {
            log('Testing updateDashboard()...');
            
            try {
                // Create a test tracker instance
                const tracker = new ExpenseTracker();
                
                // Add some test expenses
                tracker.addExpense('Coffee', 5.50, 'Coffee');
                tracker.addExpense('Lunch', 12.00, 'Food');
                tracker.addExpense('Uber', 15.00, 'Transportation');
                
                // Call updateDashboard
                tracker.updateDashboard();
                
                // Check if elements were updated
                const totalIncome = document.getElementById('total-income');
                const totalExpenses = document.getElementById('total-expenses');
                
                if (totalIncome && totalExpenses) {
                    log('✓ updateDashboard() executed successfully');
                    log(`✓ Total income element updated: ${totalIncome.textContent}`);
                    log(`✓ Total expenses element updated: ${totalExpenses.textContent}`);
                } else {
                    log('✗ Dashboard elements not found', false);
                }
            } catch (error) {
                log(`✗ Error: ${error.message}`, false);
            }
        }
        
        function testUpdateGauge() {
            log('Testing updateGauge()...');
            
            try {
                const tracker = new ExpenseTracker();
                
                // Add expenses to test gauge
                tracker.addExpense('Test Expense', 1000, 'Other');
                
                // Call updateGauge
                tracker.updateGauge();
                
                const gauge = document.querySelector('.gauge-progress');
                const percentage = document.querySelector('.percentage');
                
                if (gauge && percentage) {
                    log('✓ updateGauge() executed successfully');
                    log(`✓ Gauge percentage: ${percentage.textContent}`);
                    log(`✓ Gauge stroke-dasharray: ${gauge.style.strokeDasharray}`);
                } else {
                    log('✗ Gauge elements not found', false);
                }
            } catch (error) {
                log(`✗ Error: ${error.message}`, false);
            }
        }
        
        function testUpdateTransactionsList() {
            log('Testing updateTransactionsList()...');
            
            try {
                const tracker = new ExpenseTracker();
                
                // Add test expenses
                tracker.addExpense('Coffee', 5.50, 'Coffee');
                tracker.addExpense('Lunch', 12.00, 'Food');
                tracker.addExpense('Uber', 15.00, 'Transportation');
                
                // Call updateTransactionsList
                tracker.updateTransactionsList();
                
                const transactionsList = document.getElementById('recent-transactions');
                
                if (transactionsList) {
                    const items = transactionsList.querySelectorAll('.transaction-item');
                    log('✓ updateTransactionsList() executed successfully');
                    log(`✓ Number of transactions displayed: ${items.length}`);
                    
                    if (items.length > 0) {
                        log('✓ Transactions rendered correctly');
                    } else {
                        log('✗ No transactions rendered', false);
                    }
                } else {
                    log('✗ Transactions list element not found', false);
                }
            } catch (error) {
                log(`✗ Error: ${error.message}`, false);
            }
        }
        
        function runAllTests() {
            clearResults();
            log('=== Running All Tests ===');
            testUpdateDashboard();
            testUpdateGauge();
            testUpdateTransactionsList();
            log('=== Tests Complete ===');
        }
        
        // Auto-run tests on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                log('Dashboard UI Test Page Loaded');
                log('Click "Run All Tests" to test the implementation');
            }, 500);
        });
    </script>
</body>
</html>
